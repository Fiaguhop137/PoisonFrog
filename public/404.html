<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light dark">
        <title>404 - Page Not Found</title>
        <style>
            :root{color-scheme:light dark;--bg:#fff;--fg:#000;--poison_purple:#821896;--frog_green:#65f258}
            @media(prefers-color-scheme: dark){:root{--bg:#000;--fg:#fff}}
            *{box-sizing:border-box;margin:0;padding:0}
            body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding:24px}
            .container{max-width:600px;text-align:center}
            .error-code{font-size:clamp(100px,25vw,190px);font-weight:900;line-height:1;color:var(--frog_green);letter-spacing:-12px;text-shadow:6px 6px 0 var(--poison_purple);margin-bottom:30px}
            h1{font-size:clamp(28px,5vw,42px);margin-bottom:16px}
            p{font-size:17px;line-height:1.7;margin-bottom:32px}
            .buttons{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
            a{display:inline-block;padding:13px 28px;border:2px solid var(--frog_green);border-radius:8px;color:var(--fg);text-decoration:none;font-weight:700;transition:background 0.2s,color 0.2s,transform .2s}
            a.primary{background:var(--frog_green);color:#000}
            a.secondary{border-color:var(--poison_purple)}
            a:hover{background:var(--poison_purple);color:#fff;border-color:var(--poison_purple);transform:translateY(-3px)}
            a:focus-visible{outline:3px solid var(--frog_green);outline-offset:5px}
            .footer{margin-top:60px;font-size:12px;opacity:.5}
        </style>
    </head>
    <body>
        <main class="container">
            <div class="error-code">404</div>
            <h1>Well, this is awkward.</h1>
            <p>The page you are looking for might have been moved, deleted, or never existed in the first place.</p>
            <div class="buttons">
                <a class="primary" href="/">Home</a>
                <a class="secondary" href="javascript:history.back()">Back</a>
            </div>
            <div class="footer">
                ERROR 404 - PAGE NOT FOUND
            </div>
        </main>
    </body>
</html>
